# Primary law, court rules, ethics guidance and tax authority for the law-firm vertical. New Jersey
# and federal, jurisdiction-tagged.
#
# Statutes, court rules and regulations are government edicts and free to quote; the agency pages
# that explain them — the Division of Taxation's guides, the Judiciary's notices — are state works
# with no blanket license, so they are classed as free to read and cited rather than reproduced.
# Federal works (the IRS, the CFPB, the US Code as published by the House) are public domain.
#
# Reachability note. njcourts.gov and americanbar.org refuse automated requests from some networks
# with a 403. That is a bot filter rather than a dead link, and `check-sources.py --online` reports
# it as a warning for exactly that reason; every URL below was opened first-hand on the checked
# date. The New Jersey Legislature publishes the full statute text as a downloadable archive,
# recorded as the `data` form of the statutes entry, which is how the section texts cited in this
# vertical were verified.

[[source]]
id = "nj-statutes"
title = "New Jersey Statutes — current text"
publisher = "New Jersey Legislature, Office of Legislative Services"
url = "https://lis.njleg.state.nj.us/nxt/gateway.dll?f=templates&fn=default.htm"
license = "public-domain"
jurisdiction = "NJ"
authoritative_for = "The current text of every New Jersey statute cited here — Title 3B (wills, probate, intestacy, fiduciary commissions, refunding bonds, the Uniform Trust Code), Title 46 (powers of attorney, the realty transfer fee and the Graduated Percent Fee), Title 26 (advance directives), Title 54 (the transfer inheritance tax and the bulk sale notice) and Title 52 (remote notarial acts). Read the section; a summary on a firm's website is not the law."
data = "https://pub.njleg.state.nj.us/statutes/"
skills = ["counsel:managing-attorney", "counsel:client-intake-and-engagement", "counsel:estate-plan-design", "counsel:will-and-trust-execution", "counsel:trust-funding", "counsel:estate-administration", "counsel:elder-law-and-medicaid-planning", "counsel:residential-real-estate-closings", "counsel:attorney-review-and-release"]
